<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{margin:0;padding:24px;font:12px/1.7 system-ui;background:#faf9f6;color:#353129}h1{font:700 30px Georgia;margin:0 0 8px}p{color:#8a806f}button{width:100%;background:#ff660f;color:#fff;padding:13px;border:0;border-radius:4px;cursor:pointer;margin:12px 0}button:disabled{opacity:.5;cursor:wait}#status{font-size:11px;color:#8a806f;white-space:pre-wrap}.error{color:#b34c22!important}</style><h1>D.one</h1><p>웹 앱에서 내려받은 <strong>.done.json</strong> 파일을 선택하세요.<br>사진과 텍스트를 편집 가능한 레이어로 가져옵니다.</p><input id="file" type="file" accept=".json" hidden><button id="choose">매거진 파일 가져오기</button><div id="status">Noto Sans KR · Playfair Display 글꼴이 필요합니다.</div><script>const button=document.getElementById('choose'),input=document.getElementById('file'),status=document.getElementById('status');button.onclick=()=>input.click();input.onchange=async()=>{const file=input.files[0];if(!file)return;try{if(file.size>150000000)throw Error('파일이 너무 큽니다.');const document=JSON.parse(await file.text());if(document.version!==1||!document.scenes||!document.assets)throw Error('D.one 매거진 파일이 아닙니다.');status.className='';status.textContent='레이어를 생성하고 있습니다…';button.disabled=true;parent.postMessage({pluginMessage:{type:'import',document}},'*');}catch(e){status.className='error';status.textContent=e.message;}input.value='';};onmessage=event=>{const m=event.data.pluginMessage;if(!m)return;status.textContent=m.message;if(m.type==='error')status.className='error';if(m.type==='complete'||m.type==='error')button.disabled=false;};</script></html>
